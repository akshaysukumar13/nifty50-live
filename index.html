<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIFTY 50 Live Dashboard</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b1220;
        color: #fff;
    }
    .header {
        padding: 22px 28px;
        border-bottom: 1px solid #243047;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .brand { font-size: 22px; font-weight: 700; }
    .live { color: #39d98a; font-size: 13px; }
    .container { max-width: 1200px; margin: auto; padding: 25px; }
    .card {
        background: #121c2e;
        border: 1px solid #26344d;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
    }
    .label { color: #9aa8bd; font-size: 14px; }
    .value { font-size: 42px; font-weight: 700; margin: 8px 0; }
    .change { color: #39d98a; font-size: 18px; font-weight: 600; }
    .note { color: #8997aa; font-size: 12px; margin-top: 12px; }
    .chart { height: 520px; }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 12px; }
    .footer { color: #6f7d91; font-size: 12px; text-align: center; padding: 20px; }
</style>
</head>
<body>

<div class="header">
    <div class="brand">📊 NIFTY 50 Dashboard</div>
    <div class="live">● LIVE MARKET VIEW</div>
</div>

<div class="container">
    <div class="card">
        <div class="label">NIFTY 50</div>
        <div class="value" id="price">Loading...</div>
        <div class="change" id="change">Live market data</div>
        <div class="note">
            Market data is provided through the embedded market-data widget.
        </div>
    </div>

    <div class="card chart">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
            <div id="tradingview_chart" style="height:100%;width:100%"></div>
        </div>
    </div>
</div>

<div class="footer">
    NIFTY 50 Live Dashboard • For informational purposes only
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
    "autosize": true,
    "symbol": "NSE:NIFTY",
    "interval": "5",
    "timezone": "Asia/Kolkata",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "enable_publishing": false,
    "hide_top_toolbar": false,
    "hide_legend": false,
    "allow_symbol_change": false,
    "container_id": "tradingview_chart"
});
</script>

</body>
</html>
